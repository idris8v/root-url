<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proxy</title>

<style>
:root{
  --bg:#eef2f7;
  --card:rgba(255,255,255,.9);
  --text:#111;
  --sub:rgba(0,0,0,.55);
  --accent:linear-gradient(180deg,#ffb347,#ff7a00);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115;
    --card:rgba(28,28,30,.95);
    --text:#fff;
    --sub:rgba(255,255,255,.55);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
  margin:0;
  padding:0;
}

body{
  height:100svh; /* ФИКС ДЛЯ iOS */
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
  color:var(--text);
}

.app{
  height:100%;
  padding:0 32px; /* УВЕЛИЧЕННЫЕ ОТСТУПЫ */
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:100%;
  max-width:340px;
  padding:30px 24px 34px;
  border-radius:32px;
  background:var(--card);
  backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 30px 80px rgba(0,0,0,.25);
}

.hidden{display:none;}

h1{
  text-align:center;
  font-size:20px;
  font-weight:400;
  margin-bottom:6px;
}

.sub{
  text-align:center;
  font-size:14px;
  color:var(--sub);
  margin-bottom:22px;
}

input{
  width:100%;
  padding:16px;
  border-radius:18px;
  border:none;
  background:rgba(255,255,255,.96);
  font-size:15px;
  margin-bottom:14px;
}

/* ПЕРЕКЛЮЧАТЕЛЬ */
.segment{
  display:flex;
  background:rgba(255,255,255,.75);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:14px;
}

.segment button{
  flex:1;
  padding:12px;
  border:none;
  background:none;
  font-size:14px;
  cursor:pointer;
}

.segment button.active{
  background:#000;
  color:#fff;
}

/* КНОПКИ */
.main{
  width:100%;
  padding:18px;
  border-radius:22px;
  border:none;
  background:var(--accent);
  color:#fff;
  font-size:16px;
  margin-top:6px;
}

.link-box{
  margin-top:16px;
  padding:14px;
  border-radius:16px;
  background:rgba(255,255,255,.85);
  font-size:13px;
  text-align:center;
  word-break:break-all;
}

.btn{
  width:100%;
  padding:18px;
  border-radius:22px;
  border:none;
  font-size:14px;
  letter-spacing:.05em;
  color:#fff;
  margin-bottom:14px;
}

.whatsapp{background:linear-gradient(180deg,#34d77c,#27b765);}
.telegram{background:linear-gradient(180deg,#42a5f5,#1e88e5);}
</style>
</head>

<body>
<div class="app">

  <!-- ЭКРАН 1 -->
  <div class="card" id="screenCreate">
    <h1>Создание ссылки</h1>
    <div class="sub">Ограниченный доступ к Proxy</div>

    <input id="proxyInput" placeholder="WhatsApp Proxy URL">

    <div class="segment">
      <button id="modeViews" class="active">Открытия</button>
      <button id="modeTime">Минуты</button>
    </div>

    <input id="valueInput" type="number" value="1">

    <button class="main" id="createBtn">Создать ссылку</button>

    <div id="result" class="hidden">
      <div class="link-box" id="linkBox"></div>
      <button class="main" onclick="goConnect()">Продолжить</button>
    </div>
  </div>

  <!-- ЭКРАН 2 -->
  <div class="card hidden" id="screenConnect">
    <h1>ПРОКСИ</h1>
    <div class="sub">
      Подключи и у тебя будет работать всё<br>
      без VPN
    </div>

    <button class="btn whatsapp">ПОДКЛЮЧИТЬ ДЛЯ WHATSAPP</button>
    <button class="btn telegram">ПОДКЛЮЧИТЬ ДЛЯ TELEGRAM</button>
  </div>

</div>

<script>
let mode = "views";

const modeViews = document.getElementById("modeViews");
const modeTime  = document.getElementById("modeTime");
const createBtn = document.getElementById("createBtn");
const resultBox = document.getElementById("result");
const linkBox   = document.getElementById("linkBox");

modeViews.onclick = () => setMode("views");
modeTime.onclick  = () => setMode("time");

function setMode(m){
  mode = m;
  modeViews.classList.toggle("active", m==="views");
  modeTime.classList.toggle("active", m==="time");
}

createBtn.onclick = () => {
  // здесь обычно fetch к серверу
  const fakeToken = Math.random().toString(36).slice(2,8);
  const link = location.origin + "/" + fakeToken;

  linkBox.textContent = link;
  resultBox.classList.remove("hidden");
};

function goConnect(){
  document.getElementById("screenCreate").classList.add("hidden");
  document.getElementById("screenConnect").classList.remove("hidden");
}
</script>
</body>
</html>
