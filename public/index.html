<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxy Generator</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #f2f4f8, #e9ecf1);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
}
.card {
  width: 360px;
  padding: 24px;
  border-radius: 28px;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(20px);
}
input {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 14px;
  border: none;
}
button {
  width: 100%;
  padding: 14px;
  border-radius: 18px;
  border: none;
  font-weight: 600;
}
.result {
  margin-top: 14px;
  font-size: 13px;
  word-break: break-all;
}
</style>
</head>

<body>
<div class="card">
  <input id="wa" placeholder="WhatsApp Proxy URL">
  <input id="views" type="number" min="1" value="1">
  <button onclick="generate()">Сгенерировать ссылку</button>
  <div class="result" id="result"></div>
</div>

<script>
async function generate() {
  const whatsapp = document.getElementById("wa").value;
  const views = document.getElementById("views").value;

  const res = await fetch("/api/create", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ whatsapp, views })
  });

  const data = await res.json();
  document.getElementById("result").innerText =
    location.origin + "/l/" + data.token;
}
</script>
</body>
</html>
