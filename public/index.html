<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ПРОКСИ</title>

<style>
:root{
  --bg:#eef2f7;
  --card:rgba(255,255,255,.85);
  --text:#111;
  --sub:rgba(0,0,0,.55);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115;
    --card:rgba(28,28,30,.9);
    --text:#fff;
    --sub:rgba(255,255,255,.55);
  }
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
}

body{
  height:100svh; /* 🔑 ФИКС ДЛЯ iOS */
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
  color:var(--text);
}

/* ===== CENTER WRAPPER ===== */
.app{
  height:100%;
  padding:0 32px; /* 🔑 БОЛЬШЕ ОТСТУПОВ ПО БОКАМ */
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ===== BACKGROUND BLUR ===== */
.bg{
  position:fixed;
  inset:-40px;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,180,100,.35),transparent 45%),
    radial-gradient(circle at 80% 20%,rgba(120,170,255,.35),transparent 45%),
    var(--bg);
  filter:blur(50px);
  z-index:-1;
}

/* ===== CARD ===== */
.sheet{
  width:100%;
  max-width:340px;
  padding:32px 26px 36px;
  border-radius:32px;
  background:var(--card);
  backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 30px 80px rgba(0,0,0,.25);
  animation:sheetIn .8s cubic-bezier(.22,1,.36,1);
}

@keyframes sheetIn{
  from{
    transform:translateY(60px) scale(.96);
    opacity:0;
  }
  to{
    transform:none;
    opacity:1;
  }
}

/* ===== TEXT ===== */
h1{
  text-align:center;
  font-size:22px;
  font-weight:400;
  letter-spacing:.08em;
  margin-bottom:10px;
}

.sub{
  text-align:center;
  font-size:14px;
  color:var(--sub);
  margin-bottom:28px;
  line-height:1.4;
}

/* ===== BUTTONS ===== */
.btn{
  width:100%;
  padding:18px;
  border-radius:22px;
  border:none;
  font-size:14px;
  letter-spacing:.06em;
  font-weight:400;
  color:#fff;
  margin-bottom:14px;
  box-shadow:
    0 16px 32px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.35);
  transition:
    transform .25s cubic-bezier(.22,1,.36,1),
    box-shadow .25s;
}

.btn:active{
  transform:translateY(2px) scale(.97);
  box-shadow:
    0 10px 20px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.25);
}

.whatsapp{
  background:linear-gradient(180deg,#31d16c,#25b65b);
}

.telegram{
  background:linear-gradient(180deg,#3daaf5,#1c7fe8);
}
</style>
</head>

<body>
<div class="bg"></div>

<div class="app">
  <div class="sheet">
    <h1>ПРОКСИ</h1>
    <div class="sub">
      ПОДКЛЮЧИ И У ТЕБЯ БУДЕТ РАБОТАТЬ ВСЁ<br>
      БЕЗ VPN
    </div>

    <button class="btn whatsapp">
      ПОДКЛЮЧИТЬ ДЛЯ WHATSAPP
    </button>

    <button class="btn telegram">
      ПОДКЛЮЧИТЬ ДЛЯ TELEGRAM
    </button>
  </div>
</div>
</body>
</html>
