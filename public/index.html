<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Создание ссылки</title>
<style>
body{
  margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#eef2f7,#dfe6ee);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
}
.card{
  width:100%;max-width:390px;padding:28px;border-radius:34px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(30px);
  box-shadow:0 30px 60px rgba(0,0,0,.12);
}
input{
  width:100%;padding:14px;border-radius:22px;border:none;
  margin-bottom:14px;
}
.segment{
  display:flex;background:#f1f1f1;border-radius:22px;margin-bottom:14px;
}
.segment button{
  flex:1;padding:12px;border:none;border-radius:22px;background:none;
}
.segment .active{background:#000;color:#fff}
button.main{
  width:100%;padding:16px;border-radius:26px;border:none;
  background:linear-gradient(180deg,#ffb347,#ff7a00);
  color:#fff;font-weight:700;
}
.copy{
  margin-top:14px;padding:12px;border-radius:18px;
  background:#f7f7f7;font-size:13px;cursor:pointer;
}
.copied{color:#25a244;font-weight:600}
</style>
</head>
<body>
<div class="card">
<input id="wa" placeholder="WhatsApp Proxy URL">

<div class="segment">
<button id="v" class="active" onclick="setMode('views')">Открытия</button>
<button id="t" onclick="setMode('time')">Минуты</button>
</div>

<input id="value" type="number" min="1" value="1">
<button class="main" onclick="gen()">Создать ссылку</button>

<div class="copy" id="copy" onclick="copy()">—</div>
</div>

<script>
let mode="views";
function setMode(m){
 mode=m;
 v.classList.toggle("active",m==="views");
 t.classList.toggle("active",m==="time");
}
let last="";
async function gen(){
 const res=await fetch("/api/create",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({whatsapp:wa.value,mode,value:value.value})
 });
 const d=await res.json();
 last=location.origin+"/"+d.token;
 copy.innerText=last;
 copy.classList.remove("copied");
}
function copy(){
 if(!last)return;
 navigator.clipboard.writeText(last);
 copy.innerText="Скопировано";
 copy.classList.add("copied");
}
</script>
</body>
</html>
