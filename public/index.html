<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Создание ссылки</title>
<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(180deg,#f2f4f8,#e9ecf1);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
}
.card {
  width:100%;
  max-width:390px;
  padding:24px;
  border-radius:28px;
  background:rgba(255,255,255,0.6);
  backdrop-filter:blur(20px);
}
.segment {
  display:flex;
  margin-bottom:16px;
}
.segment button {
  flex:1;
  padding:10px;
  border:none;
  background:rgba(255,255,255,0.7);
}
.segment button.active {
  background:#000;
  color:#fff;
}
input {
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:14px;
  border:none;
}
button.main {
  width:100%;
  padding:14px;
  border-radius:18px;
  border:none;
  font-weight:600;
}
.result {
  margin-top:14px;
  font-size:13px;
  word-break:break-all;
}
</style>
</head>
<body>
<div class="card">
<input id="wa" placeholder="WhatsApp Proxy URL">

<div class="segment">
<button id="mViews" class="active" onclick="setMode('views')">Открытия</button>
<button id="mTime" onclick="setMode('time')">Минуты</button>
</div>

<input id="value" type="number" min="1" value="1">
<button class="main" onclick="generate()">Создать ссылку</button>
<div class="result" id="result"></div>
</div>

<script>
let mode="views";
function setMode(m){
  mode=m;
  document.getElementById("mViews").classList.toggle("active",m==="views");
  document.getElementById("mTime").classList.toggle("active",m==="time");
}
async function generate(){
  const whatsapp=document.getElementById("wa").value;
  const value=document.getElementById("value").value;
  const res=await fetch("/api/create",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({whatsapp,mode,value})
  });
  const data=await res.json();
  document.getElementById("result").innerText=location.origin+"/l/"+data.token;
}
</script>
</body>
</html>
