<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Подключение Proxy</title>

<style>
:root{
  --bg:#eef2f7;
  --card:rgba(255,255,255,.82);
  --text:#111;
  --sub:rgba(0,0,0,.55);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115;
    --card:rgba(28,28,30,.85);
    --text:#fff;
    --sub:rgba(255,255,255,.55);
  }
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  padding:0 16px;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text);
}

.bg{
  position:fixed;
  inset:-40px;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,180,100,.35),transparent 45%),
    radial-gradient(circle at 80% 20%,rgba(120,170,255,.35),transparent 45%),
    var(--bg);
  filter:blur(50px);
  z-index:-1;
}

.sheet{
  width:100%;
  max-width:380px;
  padding:26px 22px 30px;
  border-radius:32px;
  background:var(--card);
  backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 30px 80px rgba(0,0,0,.25);
  animation:sheetIn .9s cubic-bezier(.22,1,.36,1);
}

@keyframes sheetIn{
  from{
    transform:translateY(120%) scale(.95);
    opacity:0;
  }
  to{
    transform:none;
    opacity:1;
  }
}

h1{
  text-align:center;
  font-size:20px;
  font-weight:400;
  margin-bottom:6px;
}

.sub{
  text-align:center;
  font-size:14px;
  color:var(--sub);
  margin-bottom:22px;
}

/* ===== BUTTONS ===== */

.btn{
  width:100%;
  padding:18px;
  border-radius:22px;
  border:none;
  display:flex;
  align-items:center;
  gap:12px;
  font-size:16px;
  font-weight:400;
  color:#fff;
  margin-bottom:14px;
  box-shadow:
    0 16px 32px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.35);
  transition:
    transform .25s cubic-bezier(.22,1,.36,1),
    box-shadow .25s;
}

.btn:active{
  transform:translateY(2px) scale(.97);
  box-shadow:
    0 10px 20px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.25);
}

.whatsapp{
  background:linear-gradient(180deg,#31d16c,#25b65b);
}

.telegram{
  background:linear-gradient(180deg,#3daaf5,#1c7fe8);
}

.icon{
  width:22px;
  height:22px;
  flex-shrink:0;
}
</style>
</head>

<body>
<div class="bg"></div>

<div class="sheet">
  <h1>Подключение Proxy</h1>
  <div class="sub">Выберите сервис</div>

  <!-- WhatsApp -->
  <button class="btn whatsapp">
    <svg class="icon" viewBox="0 0 32 32" fill="white">
      <path d="M19.11 17.44c-.29-.15-1.71-.84-1.98-.94-.26-.1-.45-.15-.64.15-.19.29-.74.94-.91 1.13-.17.19-.34.22-.63.07-.29-.15-1.23-.45-2.34-1.44-.86-.77-1.44-1.72-1.61-2.01-.17-.29-.02-.45.13-.6.13-.13.29-.34.43-.51.14-.17.19-.29.29-.48.1-.19.05-.36-.02-.51-.07-.15-.64-1.55-.88-2.13-.23-.55-.47-.48-.64-.49-.17-.01-.36-.01-.55-.01-.19 0-.51.07-.78.36-.27.29-1.02 1-.02 2.43 1 1.43 1.76 2.5 3.51 3.43 2.06 1.11 2.06.74 2.43.69.37-.05 1.2-.49 1.37-.96.17-.48.17-.89.12-.96-.05-.07-.26-.12-.55-.27z"/>
    </svg>
    Подключить для WhatsApp
  </button>

  <!-- Telegram -->
  <button class="btn telegram">
    <svg class="icon" viewBox="0 0 24 24" fill="white">
      <path d="M9.964 14.611l-.405 5.69c.58 0 .83-.25 1.13-.55l2.71-2.57 5.62 4.11c1.03.57 1.76.27 2.02-.95L24 2.88c.31-1.45-.53-2.02-1.54-1.65L1.14 9.3c-1.39.54-1.37 1.3-.25 1.65l5.59 1.74L19.53 5.5c.65-.43 1.25-.19.76.24"/>
    </svg>
    Подключить для Telegram
  </button>
</div>
</body>
</html>
