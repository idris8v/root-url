<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Создание ссылки</title>

<style>
:root{
  --bg:#eef2f7;
  --card:rgba(255,255,255,.82);
  --text:#111;
  --sub:rgba(0,0,0,.55);
  --accent:linear-gradient(180deg,#ffb347,#ff7a00);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115;
    --card:rgba(28,28,30,.85);
    --text:#fff;
    --sub:rgba(255,255,255,.55);
  }
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  height:100vh;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text);
  overflow:hidden;
}

/* BACKGROUND BLUR */
.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,180,100,.35),transparent 45%),
    radial-gradient(circle at 80% 20%,rgba(120,170,255,.35),transparent 45%),
    var(--bg);
  filter:blur(50px);
  z-index:-1;
}

/* SHEET */
.sheet{
  width:100%;
  max-width:420px;
  padding:22px 22px 34px;
  border-radius:32px;
  background:var(--card);
  backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 30px 80px rgba(0,0,0,.25);
  animation:sheetCenter .9s cubic-bezier(.22,1,.36,1);
}

@keyframes sheetCenter{
  from{
    transform:translateY(120%) scale(.94);
    opacity:0;
  }
  to{
    transform:translateY(0) scale(1);
    opacity:1;
  }
}

.handle{
  width:36px;
  height:5px;
  border-radius:3px;
  background:rgba(0,0,0,.25);
  margin:0 auto 16px;
}

/* TEXT */
h1{
  text-align:center;
  font-size:20px;
  font-weight:400;
  margin-bottom:6px;
}
.sub{
  text-align:center;
  font-size:14px;
  color:var(--sub);
  margin-bottom:22px;
}

/* INPUTS */
input{
  width:100%;
  padding:15px 16px;
  border-radius:18px;
  border:none;
  background:rgba(255,255,255,.9);
  font-size:15px;
  margin-bottom:14px;
}

.segment{
  display:flex;
  background:rgba(255,255,255,.65);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:14px;
}

.segment button{
  flex:1;
  padding:12px;
  border:none;
  background:none;
  font-size:14px;
  transition:.35s cubic-bezier(.22,1,.36,1);
}

.segment .active{
  background:#000;
  color:#fff;
}

/* MAIN BUTTON */
.main{
  width:100%;
  padding:18px;
  border-radius:22px;
  border:none;
  background:var(--accent);
  color:#fff;
  font-size:16px;
  font-weight:500;
  box-shadow:
    0 18px 36px rgba(255,122,0,.45),
    inset 0 1px 0 rgba(255,255,255,.4);
  transition:
    transform .25s cubic-bezier(.22,1,.36,1),
    box-shadow .25s;
}

.main:active{
  transform:translateY(2px) scale(.97);
  box-shadow:
    0 10px 20px rgba(255,122,0,.35),
    inset 0 1px 0 rgba(255,255,255,.25);
}

/* COPY */
.copy{
  margin-top:18px;
  padding:14px;
  border-radius:16px;
  background:rgba(255,255,255,.7);
  text-align:center;
  font-size:13px;
  opacity:0;
  transform:scale(.96);
  transition:.4s cubic-bezier(.22,1,.36,1);
}

.copy.show{
  opacity:1;
  transform:scale(1);
}

.copy.copied{
  color:#25a244;
  font-weight:500;
}
</style>
</head>

<body>
<div class="bg"></div>

<div class="sheet">
  <div class="handle"></div>

  <h1>Создание ссылки</h1>
  <div class="sub">Ограниченный доступ к Proxy</div>

  <input id="waInput" placeholder="WhatsApp Proxy URL">

  <div class="segment">
    <button id="viewsBtn" class="active">Открытия</button>
    <button id="timeBtn">Минуты</button>
  </div>

  <input id="valueInput" type="number" min="1" value="1">

  <button class="main" id="createBtn">Создать ссылку</button>

  <div class="copy" id="copyBox"></div>
</div>

<script>
let mode="views";
let lastLink="";

const waInput=document.getElementById("waInput");
const valueInput=document.getElementById("valueInput");
const createBtn=document.getElementById("createBtn");
const copyBox=document.getElementById("copyBox");

viewsBtn.onclick=()=>switchMode("views");
timeBtn.onclick =()=>switchMode("time");

function switchMode(m){
  mode=m;
  viewsBtn.classList.toggle("active",m==="views");
  timeBtn.classList.toggle("active",m==="time");
  haptic();
}

createBtn.onclick=async()=>{
  if(!waInput.value) return;

  haptic();
  createBtn.textContent="Создание…";
  createBtn.disabled=true;

  const res=await fetch("/api/create",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      whatsapp:waInput.value,
      mode,
      value:valueInput.value
    })
  });

  const data=await res.json();
  lastLink=location.origin+"/"+data.token;

  copyBox.textContent=lastLink;
  copyBox.className="copy show";
  createBtn.textContent="Создать ссылку";
  createBtn.disabled=false;
};

copyBox.onclick=()=>{
  navigator.clipboard.writeText(lastLink);
  copyBox.textContent="Скопировано";
  copyBox.classList.add("copied");
  haptic();
};

function haptic(){
  if(navigator.vibrate) navigator.vibrate(12);
}
</script>
</body>
</html>
