<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Создание ссылки</title>

<style>
/* ===================== */
/*  iOS DESIGN TOKENS    */
/* ===================== */

:root{
  --bg-light: #eef2f7;
  --bg-dark: #0f1115;

  --card-light: rgba(255,255,255,.75);
  --card-dark: rgba(28,28,30,.75);

  --text-light: #111;
  --text-dark: #fff;

  --sub-light: rgba(0,0,0,.5);
  --sub-dark: rgba(255,255,255,.55);

  --accent: linear-gradient(180deg,#ffb347,#ff7a00);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg-light: var(--bg-dark);
    --card-light: var(--card-dark);
    --text-light: var(--text-dark);
    --sub-light: var(--sub-dark);
  }
}

/* ===================== */
/*  GLOBAL               */
/* ===================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  height:100vh;
  background:var(--bg-light);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  color:var(--text-light);
}

/* ===================== */
/*  BACKGROUND BLUR      */
/* ===================== */

.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,180,100,.35),transparent 40%),
    radial-gradient(circle at 80% 30%,rgba(120,170,255,.35),transparent 45%),
    var(--bg-light);
  filter:blur(40px);
  z-index:-1;
}

/* ===================== */
/*  BOTTOM SHEET         */
/* ===================== */

.sheet{
  width:100%;
  max-width:420px;
  padding:18px 22px 34px;
  border-radius:28px 28px 0 0;
  background:var(--card-light);
  backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 -20px 60px rgba(0,0,0,.25);
  animation:sheetUp .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes sheetUp{
  from{transform:translateY(100%)}
  to{transform:none}
}

.handle{
  width:38px;
  height:5px;
  border-radius:3px;
  background:rgba(0,0,0,.2);
  margin:0 auto 14px;
}

/* ===================== */
/*  TYPOGRAPHY           */
/* ===================== */

h1{
  font-size:20px;
  font-weight:400;
  text-align:center;
  margin:6px 0 4px;
}

.sub{
  text-align:center;
  font-size:14px;
  color:var(--sub-light);
  margin-bottom:22px;
}

/* ===================== */
/*  INPUTS               */
/* ===================== */

input{
  width:100%;
  padding:15px 16px;
  border-radius:18px;
  border:none;
  background:rgba(255,255,255,.85);
  font-size:15px;
  margin-bottom:14px;
}

.segment{
  display:flex;
  background:rgba(255,255,255,.6);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:14px;
}

.segment button{
  flex:1;
  padding:12px;
  border:none;
  background:none;
  font-size:14px;
  transition:.35s cubic-bezier(.2,.8,.2,1);
}

.segment .active{
  background:#000;
  color:#fff;
}

/* ===================== */
/*  MAIN BUTTON          */
/* ===================== */

.main{
  width:100%;
  padding:18px;
  border-radius:22px;
  border:none;
  background:var(--accent);
  color:#fff;
  font-size:16px;
  font-weight:500;
  box-shadow:0 18px 36px rgba(255,122,0,.45);
  transition:
    transform .25s cubic-bezier(.2,.8,.2,1),
    box-shadow .25s;
}

.main:active{
  transform:scale(.96);
  box-shadow:0 10px 20px rgba(255,122,0,.35);
}

/* ===================== */
/*  COPY FIELD           */
/* ===================== */

.copy{
  margin-top:16px;
  padding:14px;
  border-radius:16px;
  background:rgba(255,255,255,.65);
  text-align:center;
  font-size:13px;
  opacity:0;
  transform:translateY(12px);
  transition:.4s cubic-bezier(.2,.8,.2,1);
}

.copy.show{
  opacity:1;
  transform:none;
}

.copy.copied{
  color:#25a244;
  font-weight:500;
}
</style>
</head>

<body>
<div class="bg"></div>

<div class="sheet">
  <div class="handle"></div>

  <h1>Создание ссылки</h1>
  <div class="sub">Ограниченный доступ к Proxy</div>

  <input id="waInput" placeholder="WhatsApp Proxy URL">

  <div class="segment">
    <button id="viewsBtn" class="active">Открытия</button>
    <button id="timeBtn">Минуты</button>
  </div>

  <input id="valueInput" type="number" min="1" value="1">

  <button class="main" id="createBtn">Создать ссылку</button>

  <div class="copy" id="copyBox"></div>
</div>

<script>
let mode="views";
let lastLink="";

const waInput=document.getElementById("waInput");
const valueInput=document.getElementById("valueInput");
const createBtn=document.getElementById("createBtn");
const copyBox=document.getElementById("copyBox");

viewsBtn.onclick=()=>switchMode("views");
timeBtn.onclick =()=>switchMode("time");

function switchMode(m){
  mode=m;
  viewsBtn.classList.toggle("active",m==="views");
  timeBtn.classList.toggle("active",m==="time");
  haptic();
}

createBtn.onclick=async()=>{
  if(!waInput.value) return;

  haptic();
  createBtn.textContent="Создание…";
  createBtn.disabled=true;

  const res=await fetch("/api/create",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      whatsapp:waInput.value,
      mode,
      value:valueInput.value
    })
  });

  const data=await res.json();
  lastLink=location.origin+"/"+data.token;

  copyBox.textContent=lastLink;
  copyBox.className="copy show";
  createBtn.textContent="Создать ссылку";
  createBtn.disabled=false;
};

copyBox.onclick=()=>{
  navigator.clipboard.writeText(lastLink);
  copyBox.textContent="Скопировано";
  copyBox.classList.add("copied");
  haptic();
};

function haptic(){
  if(navigator.vibrate) navigator.vibrate(12);
}
</script>
</body>
</html>
