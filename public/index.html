<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Создание ссылки</title>
<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg,#eef2f7,#dfe6ee);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
}
.card {
  width:100%;
  max-width:390px;
  padding:28px;
  border-radius:34px;
  background:rgba(255,255,255,0.8);
  backdrop-filter:blur(30px);
  box-shadow:
    0 30px 60px rgba(0,0,0,.12),
    inset 0 1px 0 rgba(255,255,255,.8);
}
input {
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border-radius:20px;
  border:none;
  background:#fff;
}
.segment {
  display:flex;
  margin-bottom:14px;
  background:#f1f1f1;
  border-radius:20px;
}
.segment button {
  flex:1;
  padding:12px;
  border:none;
  border-radius:20px;
  background:none;
}
.segment .active {
  background:#000;
  color:#fff;
}
button.main {
  width:100%;
  padding:16px;
  border-radius:26px;
  border:none;
  font-weight:700;
  background:linear-gradient(180deg,#ffb347,#ff7a00);
  color:#fff;
  box-shadow:0 16px 32px rgba(255,122,0,.45);
}
.result {
  margin-top:14px;
  font-size:13px;
  word-break:break-all;
}
</style>
</head>
<body>
<div class="card">
<input id="wa" placeholder="WhatsApp Proxy URL">

<div class="segment">
<button id="v" class="active" onclick="setMode('views')">Открытия</button>
<button id="t" onclick="setMode('time')">Минуты</button>
</div>

<input id="value" type="number" min="1" value="1">
<button class="main" onclick="generate()">Создать ссылку</button>
<div class="result" id="result"></div>
</div>

<script>
let mode="views";
function setMode(m){
  mode=m;
  document.getElementById("v").classList.toggle("active",m==="views");
  document.getElementById("t").classList.toggle("active",m==="time");
}
async function generate(){
  const whatsapp=wa.value;
  const value=document.getElementById("value").value;
  const res=await fetch("/api/create",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({whatsapp,mode,value})
  });
  const data=await res.json();
  result.innerText=location.origin+"/l/"+data.token;
}
</script>
</body>
</html>
