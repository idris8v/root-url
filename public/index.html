<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>СОЗДАНИЕ ССЫЛКИ</title>

<style>
:root{
  --bg:#eef2f7;
  --card:rgba(255,255,255,.82);
  --text:#111;
  --sub:rgba(0,0,0,.55);
  --accent:linear-gradient(180deg,#ffb347,#ff7a00);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115;
    --card:rgba(28,28,30,.85);
    --text:#fff;
    --sub:rgba(255,255,255,.55);
  }
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

/* 🍎 APPLE FONT ONLY */
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display";
  text-transform:uppercase;
}

body{
  margin:0;
  height:calc(var(--vh, 1vh) * 100);
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text);
  padding:0 24px; /* 🔑 ОТСТУПЫ ОТ КРАЁВ ЭКРАНА */
}

/* BACKGROUND */
.bg{
  position:fixed;
  inset:-40px;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,180,100,.35),transparent 45%),
    radial-gradient(circle at 80% 20%,rgba(120,170,255,.35),transparent 45%),
    var(--bg);
  filter:blur(50px);
  z-index:-1;
}

/* SHEET */
.sheet{
  width:100%;
  max-width:360px; /* 🔒 НИКОГДА НЕ НА ВСЮ ШИРИНУ */
  max-height:calc(var(--vh, 1vh) * 100 - 40px);
  padding:26px 22px 34px;
  border-radius:32px;
  background:var(--card);
  backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 30px 80px rgba(0,0,0,.25);
  overflow:auto;
  text-align:center; /* 🎯 ЦЕНТРИРОВАНИЕ ВСЕГО ТЕКСТА */
  animation:sheetCenter .9s cubic-bezier(.22,1,.36,1);
}

@keyframes sheetCenter{
  from{
    transform:translateY(120%) scale(.94);
    opacity:0;
  }
  to{
    transform:translateY(0) scale(1);
    opacity:1;
  }
}

.handle{
  width:36px;
  height:5px;
  border-radius:3px;
  background:rgba(0,0,0,.25);
  margin:0 auto 18px;
}

/* TEXT */
h1{
  font-size:20px;
  font-weight:500;
  margin-bottom:8px;
  letter-spacing:.04em;
}

.sub{
  font-size:13px;
  color:var(--sub);
  margin-bottom:24px;
  letter-spacing:.08em;
}

/* INPUTS */
input{
  width:100%;
  padding:16px;
  border-radius:18px;
  border:none;
  background:rgba(255,255,255,.9);
  font-size:14px;
  text-align:center;
  margin-bottom:14px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display";
  text-transform:uppercase;
}

/* SEGMENT */
.segment{
  display:flex;
  background:rgba(255,255,255,.65);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:14px;
}

.segment button{
  flex:1;
  padding:12px;
  border:none;
  background:none;
  font-size:13px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display";
  letter-spacing:.06em;
  transition:.35s cubic-bezier(.22,1,.36,1);
}

.segment .active{
  background:#000;
  color:#fff;
}

/* MAIN BUTTON */
.main{
  width:100%;
  padding:18px;
  border-radius:22px;
  border:none;
  background:var(--accent);
  color:#fff;
  font-size:14px;
  font-weight:600;
  letter-spacing:.08em;
  box-shadow:
    0 18px 36px rgba(255,122,0,.45),
    inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .25s cubic-bezier(.22,1,.36,1);
}

.main:active{
  transform:translateY(2px) scale(.97);
}

/* COPY */
.copy{
  margin-top:18px;
  padding:14px;
  border-radius:16px;
  background:rgba(255,255,255,.7);
  font-size:12px;
  letter-spacing:.06em;
  opacity:0;
  transform:scale(.96);
  transition:.4s cubic-bezier(.22,1,.36,1);
}

.copy.show{
  opacity:1;
  transform:scale(1);
}

.copy.copied{
  color:#25a244;
  font-weight:600;
}
</style>
</head>

<body>
<div class="bg"></div>

<div class="sheet">
  <div class="handle"></div>

  <h1>СОЗДАНИЕ ССЫЛКИ</h1>
  <div class="sub">ОГРАНИЧЕННЫЙ ДОСТУП К PROXY</div>

  <input id="waInput" placeholder="PROXY URL">

  <div class="segment">
    <button id="viewsBtn" class="active">ОТКРЫТИЯ</button>
    <button id="timeBtn">МИНУТЫ</button>
  </div>

  <input id="valueInput" type="number" min="1" value="1">

  <button class="main" id="createBtn">СОЗДАТЬ ССЫЛКУ</button>

  <div class="copy" id="copyBox"></div>
</div>

<script>
function setVH(){
  document.documentElement.style.setProperty(
    "--vh",
    window.innerHeight * 0.01 + "px"
  );
}
setVH();
window.addEventListener("resize", setVH);

let mode="views";
let lastLink="";

const waInput=document.getElementById("waInput");
const valueInput=document.getElementById("valueInput");
const createBtn=document.getElementById("createBtn");
const copyBox=document.getElementById("copyBox");
const viewsBtn=document.getElementById("viewsBtn");
const timeBtn=document.getElementById("timeBtn");

viewsBtn.onclick=()=>switchMode("views");
timeBtn.onclick =()=>switchMode("time");

function switchMode(m){
  mode=m;
  viewsBtn.classList.toggle("active",m==="views");
  timeBtn.classList.toggle("active",m==="time");
}

createBtn.onclick=async()=>{
  if(!waInput.value) return;

  createBtn.textContent="СОЗДАНИЕ…";
  createBtn.disabled=true;

  const res=await fetch("/api/create",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      whatsapp:waInput.value,
      mode,
      value:valueInput.value
    })
  });

  const data=await res.json();
  lastLink=location.origin+"/"+data.token;

  copyBox.textContent=lastLink;
  copyBox.className="copy show";
  createBtn.textContent="СОЗДАТЬ ССЫЛКУ";
  createBtn.disabled=false;
};

copyBox.onclick=()=>{
  navigator.clipboard.writeText(lastLink);
  copyBox.textContent="СКОПИРОВАНО";
  copyBox.classList.add("copied");
};
</script>
</body>
</html>
