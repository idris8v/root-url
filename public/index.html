<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ПРОКСИ</title>

<style>
:root{
  --bg:#eef2f7;
  --card:rgba(255,255,255,.82);
  --text:#111;
  --sub:rgba(0,0,0,.55);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115;
    --card:rgba(28,28,30,.85);
    --text:#fff;
    --sub:rgba(255,255,255,.55);
  }
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  padding:0 20px; /* 🔑 SAFE ОТСТУПЫ */
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text);
}

/* BACKGROUND */
.bg{
  position:fixed;
  inset:-40px;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,180,100,.35),transparent 45%),
    radial-gradient(circle at 80% 20%,rgba(120,170,255,.35),transparent 45%),
    var(--bg);
  filter:blur(50px);
  z-index:-1;
}

/* CARD */
.sheet{
  width:100%;
  max-width:360px;
  padding:28px 24px 32px;
  border-radius:32px;
  background:var(--card);
  backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 30px 80px rgba(0,0,0,.25);
  animation:appear .9s cubic-bezier(.22,1,.36,1);
}

@keyframes appear{
  from{
    transform:translateY(60px) scale(.96);
    opacity:0;
  }
  to{
    transform:none;
    opacity:1;
  }
}

/* TEXT */
h1{
  text-align:center;
  font-size:22px;
  font-weight:400;
  letter-spacing:.08em;
  margin-bottom:6px;
}

.sub{
  text-align:center;
  font-size:13px;
  letter-spacing:.06em;
  color:var(--sub);
  margin-bottom:26px;
}

/* BUTTONS */
.btn{
  width:100%;
  padding:18px;
  border-radius:22px;
  border:none;
  font-size:14px;
  letter-spacing:.06em;
  font-weight:400;
  color:#fff;
  margin-bottom:14px;
  box-shadow:
    0 16px 32px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.35);
  transition:
    transform .25s cubic-bezier(.22,1,.36,1),
    box-shadow .25s;
}

.btn:active{
  transform:translateY(2px) scale(.97);
  box-shadow:
    0 10px 20px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.25);
}

.whatsapp{
  background:linear-gradient(180deg,#34d77c,#27b765);
}

.telegram{
  background:linear-gradient(180deg,#42a5f5,#1e88e5);
}
</style>
</head>

<body>
<div class="bg"></div>

<div class="sheet">
  <h1>ПРОКСИ</h1>
  <div class="sub">ВЫБЕРИТЕ СЕРВИС</div>

  <button class="btn whatsapp">
    ПОДКЛЮЧИТЬ ДЛЯ WHATSAPP
  </button>

  <button class="btn telegram">
    ПОДКЛЮЧИТЬ ДЛЯ TELEGRAM
  </button>
</div>
</body>
</html>
